<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#4f46e5">

    <title>TaskFlow - Task Management</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #111827;
        }

        /* HEADER */

        header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 25px;
        }

        .header-container {
            max-width: 1200px;
            margin: auto;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        header p {
            margin: 5px 0 0;
        }

        #status {
            padding: 8px 15px;
            border-radius: 20px;
            background: #ffffff33;
        }

        /* MAIN */

        .container {
            max-width: 1200px;
            margin: 25px auto;
            padding: 0 20px;
        }

        /* STATISTICS */

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #00000010;
        }

        .stat-card h2 {
            margin: 0;
            font-size: 28px;
        }

        .stat-card p {
            color: #6b7280;
            margin-bottom: 0;
        }

        /* MAIN GRID */

        .main-grid {
            display: grid;
            grid-template-columns: 330px 1fr;
            gap: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #00000010;
        }

        .card h2 {
            margin-top: 0;
        }

        /* FORM */

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #4f46e5;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button {
            border: none;
            cursor: pointer;
            border-radius: 8px;
            padding: 10px 15px;
            font-weight: bold;
        }

        .primary {
            width: 100%;
            margin-top: 20px;
            background: #4f46e5;
            color: white;
        }

        .secondary {
            background: #eef2ff;
            color: #3730a3;
        }

        .notification {
            width: 100%;
            margin-top: 10px;
            background: #eef2ff;
            color: #3730a3;
        }

        /* TOOLBAR */

        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .toolbar input {
            flex: 1;
        }

        .toolbar select {
            width: 150px;
        }

        /* TASK */

        .task-list {
            display: grid;
            gap: 12px;
        }

        .task {
            background: white;
            border: 1px solid #e5e7eb;
            border-left: 5px solid #9ca3af;
            border-radius: 10px;
            padding: 15px;
        }

        .task.high {
            border-left-color: #ef4444;
        }

        .task.medium {
            border-left-color: #f59e0b;
        }

        .task.low {
            border-left-color: #10b981;
        }

        .task.completed {
            opacity: 0.6;
        }

        .task.completed .task-title {
            text-decoration: line-through;
        }

        .task-header {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .task-title {
            flex: 1;
            font-weight: bold;
            font-size: 17px;
        }

        .priority {
            padding: 5px 8px;
            border-radius: 15px;
            background: #f3f4f6;
            font-size: 12px;
        }

        .task-info {
            margin-top: 10px;
            color: #6b7280;
            font-size: 14px;
        }

        .task-actions {
            margin-top: 12px;
            display: flex;
            gap: 8px;
        }

        .delete {
            color: #dc2626;
        }

        .empty {
            text-align: center;
            color: #6b7280;
            padding: 40px;
        }

        /* RESPONSIVE */

        @media (max-width: 800px) {

            .main-grid {
                grid-template-columns: 1fr;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 500px) {

            .header-container {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            header h1 {
                font-size: 24px;
            }

            .container {
                padding: 0 12px;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .row {
                grid-template-columns: 1fr;
            }

            .toolbar {
                flex-direction: column;
            }

            .toolbar select {
                width: 100%;
            }

            .task-actions {
                flex-wrap: wrap;
            }

        }

    </style>
</head>

<body>

<header>

    <div class="header-container">

        <div>
            <h1>TaskFlow</h1>
            <p>Task Management System</p>
        </div>

        <div id="status">
            Checking...
        </div>

    </div>

</header>


<div class="container">

    <!-- STATISTICS -->

    <div class="stats">

        <div class="stat-card">
            <h2 id="total">0</h2>
            <p>Total Tasks</p>
        </div>

        <div class="stat-card">
            <h2 id="pending">0</h2>
            <p>Pending</p>
        </div>

        <div class="stat-card">
            <h2 id="completed">0</h2>
            <p>Completed</p>
        </div>

        <div class="stat-card">
            <h2 id="dueSoon">0</h2>
            <p>Due Soon</p>
        </div>

    </div>


    <div class="main-grid">

        <!-- ADD TASK -->

        <div class="card">

            <h2>Add Task</h2>

            <form id="taskForm">

                <label>Task Title</label>

                <input
                    type="text"
                    id="title"
                    placeholder="Enter task"
                    required
                >


                <div class="row">

                    <div>

                        <label>Priority</label>

                        <select id="priority">

                            <option value="high">
                                High
                            </option>

                            <option value="medium" selected>
                                Medium
                            </option>

                            <option value="low">
                                Low
                            </option>

                        </select>

                    </div>


                    <div>

                        <label>Due Date</label>

                        <input
                            type="datetime-local"
                            id="due"
                        >

                    </div>

                </div>


                <label>Category</label>

                <input
                    type="text"
                    id="category"
                    placeholder="College / Personal"
                >


                <button
                    class="primary"
                    type="submit"
                >
                    Add Task
                </button>

            </form>


            <button
                class="notification"
                id="notificationButton"
            >
                🔔 Enable Notifications
            </button>

        </div>


        <!-- TASK LIST -->

        <div class="card">

            <h2>Your Tasks</h2>


            <div class="toolbar">

                <input
                    type="text"
                    id="search"
                    placeholder="Search tasks..."
                >


                <select id="filter">

                    <option value="all">
                        All
                    </option>

                    <option value="pending">
                        Pending
                    </option>

                    <option value="completed">
                        Completed
                    </option>

                    <option value="high">
                        High Priority
                    </option>

                </select>

            </div>


            <div
                id="taskList"
                class="task-list"
            >

            </div>

        </div>

    </div>

</div>


<script>

    /*
       OFFLINE STORAGE
    */

    let tasks =
        JSON.parse(
            localStorage.getItem("tasks")
        ) || [];


    /*
       SAVE TASKS
    */

    function saveTasks() {

        localStorage.setItem(
            "tasks",
            JSON.stringify(tasks)
        );

    }


    /*
       ADD TASK
    */

    document
        .getElementById("taskForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();


            const title =
                document.getElementById("title").value;


            const priority =
                document.getElementById("priority").value;


            const due =
                document.getElementById("due").value;


            const category =
                document.getElementById("category").value;


            const task = {

                id: Date.now(),

                title: title,

                priority: priority,

                due: due,

                category: category,

                completed: false

            };


            tasks.push(task);


            saveTasks();


            this.reset();


            displayTasks();

        });


    /*
       DISPLAY TASKS
    */

    function displayTasks() {

        const list =
            document.getElementById("taskList");


        const search =
            document
            .getElementById("search")
            .value
            .toLowerCase();


        const filter =
            document
            .getElementById("filter")
            .value;


        let filteredTasks =
            tasks.filter(function(task) {

                const matchesSearch =
                    task.title
                    .toLowerCase()
                    .includes(search);


                let matchesFilter = true;


                if (filter === "pending") {

                    matchesFilter =
                        !task.completed;

                }


                if (filter === "completed") {

                    matchesFilter =
                        task.completed;

                }


                if (filter === "high") {

                    matchesFilter =
                        task.priority === "high";

                }


                return matchesSearch &&
                       matchesFilter;

            });


        if (filteredTasks.length === 0) {

            list.innerHTML =
                `<div class="empty">
                    No tasks found
                </div>`;

            updateStatistics();

            return;

        }


        list.innerHTML = "";


        filteredTasks.forEach(function(task) {

            const div =
                document.createElement("div");


            div.className =
                "task " +
                task.priority +
                (task.completed
                    ? " completed"
                    : "");


            div.innerHTML = `

                <div class="task-header">

                    <input
                        type="checkbox"
                        ${task.completed ? "checked" : ""}
                        onchange="toggleTask(${task.id})"
                    >

                    <div class="task-title">
                        ${escapeHTML(task.title)}
                    </div>

                    <span class="priority">
                        ${task.priority}
                    </span>

                </div>


                <div class="task-info">

                    📅 ${
                        task.due
                        ? new Date(task.due)
                            .toLocaleString()
                        : "No deadline"
                    }

                    <br>

                    🏷️ ${
                        task.category || "No category"
                    }

                </div>


                <div class="task-actions">

                    <button
                        class="secondary"
                        onclick="editTask(${task.id})"
                    >
                        Edit
                    </button>


                    <button
                        class="secondary delete"
                        onclick="deleteTask(${task.id})"
                    >
                        Delete
                    </button>

                </div>

            `;


            list.appendChild(div);

        });


        updateStatistics();

    }


    /*
       COMPLETE TASK
    */

    function toggleTask(id) {

        const task =
            tasks.find(
                function(t) {
                    return t.id === id;
                }
            );


        if (task) {

            task.completed =
                !task.completed;

            saveTasks();

            displayTasks();

        }

    }


    /*
       DELETE TASK
    */

    function deleteTask(id) {

        tasks =
            tasks.filter(
                function(task) {
                    return task.id !== id;
                }
            );


        saveTasks();


        displayTasks();

    }


    /*
       EDIT TASK
    */

    function editTask(id) {

        const task =
            tasks.find(
                function(t) {
                    return t.id === id;
                }
            );


        if (!task) return;


        document.getElementById("title").value =
            task.title;


        document.getElementById("priority").value =
            task.priority;


        document.getElementById("due").value =
            task.due;


        document.getElementById("category").value =
            task.category;


        deleteTask(id);

    }


    /*
       SEARCH
    */

    document
        .getElementById("search")
        .addEventListener(
            "input",
            displayTasks
        );


    /*
       FILTER
    */

    document
        .getElementById("filter")
        .addEventListener(
            "change",
            displayTasks
        );


    /*
       STATISTICS
    */

    function updateStatistics() {

        const total =
            tasks.length;


        const completed =
            tasks.filter(
                t => t.completed
            ).length;


        const pending =
            total - completed;


        const dueSoon =
            tasks.filter(function(task) {

                if (
                    task.completed ||
                    !task.due
                ) {
                    return false;
                }


                const difference =
                    new Date(task.due)
                    - new Date();


                return (
                    difference > 0 &&
                    difference <=
                    24 * 60 * 60 * 1000
                );

            }).length;


        document.getElementById("total")
            .textContent = total;


        document.getElementById("pending")
            .textContent = pending;


        document.getElementById("completed")
            .textContent = completed;


        document.getElementById("dueSoon")
            .textContent = dueSoon;

    }


    /*
       NOTIFICATIONS
    */

    document
        .getElementById("notificationButton")
        .addEventListener(
            "click",
            async function() {

                if (!("Notification" in window)) {

                    alert(
                        "Your browser does not support notifications."
                    );

                    return;

                }


                const permission =
                    await Notification
                    .requestPermission();


                if (permission === "granted") {

                    this.textContent =
                        "🔔 Notifications Enabled";


                    new Notification(
                        "TaskFlow",
                        {
                            body:
                                "Task notifications are enabled!"
                        }
                    );

                }

            }
        );


    /*
       CHECK DUE TASKS
    */

    function checkNotifications() {

        if (
            !("Notification" in window) ||
            Notification.permission !== "granted"
        ) {
            return;
        }


        const currentTime =
            new Date();


        tasks.forEach(function(task) {

            if (
                task.completed ||
                !task.due
            ) {
                return;
            }


            const dueTime =
                new Date(task.due);


            if (
                dueTime <= currentTime &&
                !task.notified
            ) {

                new Notification(
                    "Task Due!",
                    {
                        body:
                            task.title
                    }
                );


                task.notified = true;


                saveTasks();

            }

        });

    }


    /*
       CHECK EVERY 15 SECONDS
    */

    setInterval(
        checkNotifications,
        15000
    );


    /*
       ONLINE / OFFLINE STATUS
    */

    function updateStatus() {

        const status =
            document.getElementById("status");


        if (navigator.onLine) {

            status.textContent =
                "🟢 Online";

        } else {

            status.textContent =
                "🔴 Offline";

        }

    }


    window.addEventListener(
        "online",
        updateStatus
    );


    window.addEventListener(
        "offline",
        updateStatus
    );


    /*
       SECURITY
    */

    function escapeHTML(text) {

        const div =
            document.createElement("div");

        div.textContent = text;

        return div.innerHTML;

    }


    /*
       INITIAL LOAD
    */

    updateStatus();

    displayTasks();

</script>

</body>
</html>
